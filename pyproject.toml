[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-editor-agent"
version = "0.1.0"
description = "Autonomous AI Multi-Agent Code Editor & CLI for any repository or IDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "langchain-ollama>=0.2.0",
    "ollama>=0.3.0",
    "mcp>=1.0.0",
]

[project.scripts]
codeagent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "manage", "mcp_server"]

[tool.setuptools.packages.find]
include = ["core_project*", "orchestration_app*"]
